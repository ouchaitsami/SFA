        body {

            padding: 20px;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #1a202c;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .signature-preview {
            border: 2px dashed #e2e8f0;
            padding: 20px;
            margin: 20px 0;
            background: #fafafa;
            border-radius: 8px;
        }
        .copy-btn {
            background: linear-gradient(135deg, #2EC58D 0%, #FF4F64 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            margin: 10px 5px;
            transition: all 0.3s ease;
        }
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(46, 197, 141, 0.3);
        }
        .instructions {
            background: linear-gradient(135deg, #f0fdf4 0%, #fdf2f8 100%);
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
            border-left: 4px solid #2EC58D;
        }
        .instructions h3 {
            color: #1a202c;
            margin-bottom: 15px;
        }
        .instructions ol, .instructions ul {
            color: #4a5568;
            line-height: 1.6;
        }
        .signature-versions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 30px;
        }
        @media (max-width: 768px) {
            .signature-versions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
