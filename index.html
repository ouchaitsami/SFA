    <meta charset="UTF-8" />

    <meta name="description" content="So Fresh Ads - Agence d'acquisition digitale spécialisée Google Ads et Meta Ads. L'alchimie au service de votre ROAS." />
    <title>So Fresh Ads - Agence d'Acquisition Digitale | Google Ads & Meta Ads</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      window.gtag = gtag;

      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });

      try {
        var stored = localStorage.getItem('sfa_consent');
        if (stored) {
          var c = JSON.parse(stored);
          gtag('consent', 'update', c);
        }
      } catch (e) {}

      gtag('js', new Date());
      gtag('config', 'G-STGQB66CKD', { send_page_view: true });
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-STGQB66CKD"></script>
